# ShopMaster — architecture du Sprint 1 (PBI-01)
#   frontend (React + nginx) ──► api (C# / .NET) ──► db (PostgreSQL, table users)
#   L'authentification (inscription, connexion, rôles) est déléguée à Auth0.
#
# Démarrage :  cp .env.example .env   puis   docker compose up --build
name: shopmaster

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-shopmaster}
      POSTGRES_USER: ${POSTGRES_USER:-shopmaster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Renseignez POSTGRES_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ConnectionStrings__Default: "Host=db;Port=5432;Database=${POSTGRES_DB:-shopmaster};Username=${POSTGRES_USER:-shopmaster};Password=${POSTGRES_PASSWORD}"
      Auth0__Domain: ${AUTH0_DOMAIN:?Renseignez AUTH0_DOMAIN dans .env}
      Auth0__Audience: ${AUTH0_AUDIENCE:?Renseignez AUTH0_AUDIENCE dans .env}
      Cors__AllowedOrigins: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      AUTH0_DOMAIN: ${AUTH0_DOMAIN}
      AUTH0_CLIENT_ID: ${AUTH0_CLIENT_ID:?Renseignez AUTH0_CLIENT_ID dans .env}
      AUTH0_AUDIENCE: ${AUTH0_AUDIENCE}
      # URL de l'API vue par le navigateur (et non par le conteneur).
      API_URL: ${API_URL:-http://localhost:8080}
    ports:
      - "3000:80"

volumes:
  db-data:
